<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Login - BiblioTech</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container-autenticacao">
        <div id="caixa-login">
            <h2 style="text-align: center; margin-bottom: 20px; color: #2c3e50;">Entrar no BiblioTech</h2>
            <form id="login-form-exec">
                <label for="login-email">Usuário ou Email:</label>
                <input type="text" id="login-email"
                    style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; width: 100%; box-sizing: border-box;"
                    required>

                <label for="login-senha">Senha:</label>
                <input type="password" id="login-senha"
                    style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; width: 100%; box-sizing: border-box;"
                    required>

                <button type="button" onclick="executarLogin()">Entrar</button>
            </form>
            <div class="alternar-link">
                Não tem uma conta? <a href="#" onclick="alternarTelas('cadastro')">Cadastre-se aqui</a>
            </div>
        </div>

        <div id="caixa-cadastro" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 20px; color: #2c3e50;">Criar Nova Conta</h2>
            <form id="cadastro-form-exec">
                <label for="name">Nome Completo:</label>
                <input type="text" id="name"
                    style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; width: 100%; box-sizing: border-box;"
                    required>

                <label for="cpf">CPF (11 números):</label>
                <input type="text" id="cpf"
                    style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; width: 100%; box-sizing: border-box;"
                    required>

                <label for="email">Email:</label>
                <input type="email" id="email"
                    style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; width: 100%; box-sizing: border-box;"
                    required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha"
                    style="padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; width: 100%; box-sizing: border-box;"
                    required>

                <button type="button" onclick="executarCadastro()"
                    style="padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">Registrar
                    Conta</button>
            </form>
            <div class="alternar-link">
                Já possui conta? <a href="#" onclick="alternarTelas('login')">Faça Login</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
